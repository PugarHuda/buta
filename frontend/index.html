<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No webfont, and no third party.

      This pulled JetBrains Mono and Instrument Serif from fonts.googleapis.com,
      which meant the desk made two requests to somebody else's infrastructure on
      every load - one click from a landing page that self-hosts the identical
      typeface as an inline data URI precisely so it would not. A desk whose whole
      claim is that no third party sees your bid should not begin by telling one
      that you opened it.

      The mono stack in index.css falls back to what the machine already has
      (Cascadia Mono, Consolas, ui-monospace), which is what most readers were
      seeing anyway while the webfont loaded.
    -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F4F4F0'/><g stroke='%23CE1414' stroke-width='2.4' fill='none'><circle cx='16' cy='16' r='9'/><path d='M16 3v4M16 25v4M3 16h4M25 16h4'/></g><rect x='8.4' y='14.3' width='15.2' height='3.4' fill='%230A0A0A'/></svg>" />
    <title>Buta - sealed-bid OTC desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
