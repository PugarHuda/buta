<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Arial Black',Impact,sans-serif">
  <rect width="1200" height="630" fill="#F4F4F0"/>
  <!-- hazard stripe, top -->
  <defs>
    <pattern id="hz" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="28" fill="#CE1414"/>
    </pattern>
    <pattern id="bc" width="6" height="1" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#0A0A0A"/><rect x="2" width="2" height="1" fill="#0A0A0A"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="18" fill="url(#hz)"/>

  <!-- unit id row -->
  <text x="72" y="112" font-size="20" letter-spacing="6" fill="#6E6E68" font-family="Consolas,monospace">UNIT / D-01  &#8250;&#8250;&#8250;  BUTA &#183; INDONESIAN: BLIND</text>

  <!-- macro headline -->
  <text x="68" y="250" font-size="128" letter-spacing="-5" fill="#0A0A0A">THE AUCTIONEER</text>
  <text x="68" y="372" font-size="128" letter-spacing="-5" fill="#0A0A0A">IS <tspan fill="#CE1414" font-style="italic">BLIND</tspan></text>

  <!-- rule -->
  <rect x="72" y="420" width="1056" height="2" fill="#0A0A0A"/>

  <!-- subhead -->
  <text x="72" y="474" font-size="26" fill="#3B3B38" font-family="Consolas,monospace">SEALED-BID OTC DESK &#183; FLARE CONFIDENTIAL COMPUTE</text>
  <text x="72" y="512" font-size="22" fill="#6E6E68" font-family="Consolas,monospace">Bids encrypted to an attested enclave. Nobody runs the auction.</text>

  <!-- book mock, bottom-right -->
  <g font-family="Consolas,monospace" font-size="22" fill="#0A0A0A">
    <rect x="72" y="548" width="360" height="20" fill="#0A0A0A"/>
    <rect x="452" y="548" width="300" height="20" fill="#0A0A0A"/>
    <text x="792" y="565" font-size="20" letter-spacing="4" fill="#CE1414">SEALED /// VICKREY</text>
  </g>

  <!-- barcode footer -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#bc)" opacity="0.85"/>
  <rect x="1060" y="60" width="72" height="72" fill="none" stroke="#CE1414" stroke-width="2"/>
  <line x1="1096" y1="40" x2="1096" y2="152" stroke="#CE1414" stroke-width="1"/>
  <line x1="1040" y1="96" x2="1152" y2="96" stroke="#CE1414" stroke-width="1"/>
</svg>
